# ===========================================
# Enterprise RAG Agent - Docker Compose
# ===========================================
# 当前版本：Milvus 使用外部服务（需单独部署 Milvus Standalone）
# Ollama 假设运行在宿主机或单独容器中
#
# Milvus 快速启动参考：
#   wget https://github.com/milvus-io/milvus/releases/download/v2.4.0/milvus-standalone-docker-compose.yml -O milvus-docker-compose.yml
#   docker compose -f milvus-docker-compose.yml up -d
# ===========================================

version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_metadata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - rag-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./uploads:/app/uploads
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - METADATA_DB_URL=postgresql+asyncpg://rag:rag_password@db:5432/rag_metadata
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - rag-network

  # 如需在同一 compose 中运行 Ollama，取消以下注释：
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: rag-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   restart: unless-stopped
  #   networks:
  #     - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
